name: xSDK smoke XEX build

on:
  workflow_dispatch:
  push:
    paths:
      - "platform/xsdk-smoke/**"
      - "platform/xsdk-gpu-probe/**"
      - ".github/workflows/xsdk-smoke-build.yml"

permissions:
  contents: read

jobs:
  build-xex:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out X360 Capture repository
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git
      - name: Restore cached xSDK PowerPC toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/xsdk-gcc
            ~/xsdk-gcc-work
          key: xsdk-powerpc-${{ runner.os }}-57b02f1e60667e37d22c3aa613d23d2486514ff8-v1
      - name: Check out xSDK at pinned revision
        run: |
          git clone https://github.com/xenosworks/xsdk.git xsdk
          cd xsdk
          git checkout 57b02f1e60667e37d22c3aa613d23d2486514ff8
          echo "XSDK_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build xSDK PowerPC toolchain
        working-directory: xsdk
        run: PREFIX="$HOME/xsdk-gcc" WORK="$HOME/xsdk-gcc-work" JOBS="$(nproc)" bash tools/toolchain/build.sh
      - name: Build glslang-xenon shader tools
        run: |
          git clone --depth 1 --branch xenon https://github.com/xenosworks/glslang-xenon.git glslang-xenon
          cd glslang-xenon
          python3 update_glslang_sources.py
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=ON -DSPIRV_SKIP_EXECUTABLES=ON -DGLSLANG_TESTS=OFF
          cmake --build build --parallel "$(nproc)"
          install -D build/StandAlone/glslang "$HOME/xsdk-gcc/bin/glslang"
          "$HOME/xsdk-gcc/bin/glslang" --version
      - name: Build xSDK library
        working-directory: xsdk
        run: make -j"$(nproc)" TOOLCHAIN="$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-"
      - name: Configure X360 Capture smoke title
        run: |
          cmake -S platform/xsdk-smoke -B build-xex -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" -DCMAKE_BUILD_TYPE=Release
      - name: Configure own-title GPU readback probe
        run: cmake -S platform/xsdk-gpu-probe -B build-gpu-probe -G Ninja -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/xsdk/cmake/xsdk.cmake" -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" -DCMAKE_BUILD_TYPE=Release
      - name: Compile XEX titles
        run: |
          cmake --build build-xex --parallel "$(nproc)"
          cmake --build build-gpu-probe --parallel "$(nproc)"
      - name: Verify artifact exists and report metadata
        run: |
          test -s build-xex/x360_capture_sdk_smoke.xex
          test -s build-gpu-probe/x360_capture_gpu_probe.xex
          file build-xex/x360_capture_sdk_smoke.xex build-gpu-probe/x360_capture_gpu_probe.xex
          sha256sum build-xex/x360_capture_sdk_smoke.xex build-gpu-probe/x360_capture_gpu_probe.xex | tee build-xex/SHA256SUMS.txt
          printf 'xSDK commit: %s\\n' "$XSDK_COMMIT" | tee build-xex/BUILD-INFO.txt
      - name: Upload XEX build artifact
        uses: actions/upload-artifact@v4
        with:
          name: x360-capture-xsdk-smoke-${{ github.run_number }}
          path: |
            build-xex/x360_capture_sdk_smoke.xex
            build-gpu-probe/x360_capture_gpu_probe.xex
            build-xex/SHA256SUMS.txt
            build-xex/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
